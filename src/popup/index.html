<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netrunner Card Identifier</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 260px;
        background: #1a1a1a;
        color: #eaeaea;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      p {
        margin: 0 0 8px;
      }
      kbd {
        font: inherit;
        background: #333;
        border: 1px solid #555;
        border-radius: 3px;
        padding: 0 4px;
      }
      #about {
        margin: 12px 0 0;
        font-size: 11px;
        color: #888;
      }
      #about a {
        color: #b288ff;
        text-decoration: none;
      }
      #about a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Netrunner Card Identifier</h1>
    <p>
      Hold <kbd>Alt</kbd> (⌥ Option on Mac) and drag a rectangle around a card
      in a paused video to identify it. The matched card art floats next to your
      cursor.
    </p>
    <p id="about">
      <a href="#" id="about-link">About &amp; source</a>
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
